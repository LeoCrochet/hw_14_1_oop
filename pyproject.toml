[tool.poetry]
name = "hw-14-1-oop"
version = "0.1.0"
description = "E-commerce core: Product and Category classes (14.1 OOP homework)"
authors = ["tr777"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.14"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^6.0.0"
flake8 = "^7.1.0"
black = "^24.10.0"
isort = "^5.13.0"
mypy = "^1.13.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# --- Formatters / linters ---

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["src"]

[tool.mypy]
python_version = "3.14"
explicit_package_bases = true
mypy_path = "."
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
check_untyped_defs = true

# --- Tests / coverage ---

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
omit = ["src/__init__.py", "tests/*"]
show_missing = true
skip_covered = false